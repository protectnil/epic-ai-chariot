{{- /* CH-28 fail-closed: only generate a Secret from an inline password, and
       only after asserting it is non-blank and not a known insecure default
       (mirrors src/iam/bootstrap.ts). When auth.existingSecret is set, the
       operator owns the credential and this template emits nothing. */ -}}
{{- if not .Values.auth.existingSecret }}
{{- include "chariot.assertStrongSecret" (dict "value" .Values.auth.rootPassword "field" "mongodb.auth.rootPassword") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chariot-mongodb.secretName" . }}
  labels:
    {{- include "chariot-mongodb.labels" . | nindent 4 }}
type: Opaque
stringData:
  mongodb-root-password: {{ .Values.auth.rootPassword | quote }}
  {{- if .Values.auth.password }}
  {{- include "chariot.assertStrongSecret" (dict "value" .Values.auth.password "field" "mongodb.auth.password") }}
  mongodb-password: {{ .Values.auth.password | quote }}
  {{- end }}
{{- end }}
