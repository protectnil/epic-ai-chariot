{{- /* CH-28 fail-closed: generate a Secret only from a vetted inline password
       (mirrors src/iam/bootstrap.ts). With auth.existingSecret set, the operator
       owns the credential and this emits nothing. */ -}}
{{- if not .Values.auth.existingSecret }}
{{- include "chariot.assertStrongSecret" (dict "value" .Values.auth.password "field" "redis.auth.password") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chariot-redis.secretName" . }}
  labels:
    {{- include "chariot-redis.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ .Values.auth.password | quote }}
{{- end }}
