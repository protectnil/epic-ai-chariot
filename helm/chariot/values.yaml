# ── Writable volume (CH-30) ──────────────────────────────────────────────────
# Mounted at EPIC_AI_DIR_OVERRIDE (/var/lib/chariot). ALL runtime writers
# (license cache, recovery store, Edge shard working copy, health file) target
# it, so the container root filesystem stays read-only.
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  existingClaim: ""

# ── Pod / container security (CH-30 non-root least-privilege) ─────────────────
# seccomp.customProfile: opt-in hardened Localhost profile (Wiz "isolate and
# sandbox" gap #10). RuntimeDefault (the kubelet-shipped moderate profile)
# stays the DEFAULT — flip customProfile.enabled=true to switch BOTH
# podSecurityContext AND securityContext to
# `type: Localhost, localhostProfile: <profiles/chariot-hardened.json>`. The
# profile file ships in the chart (files/seccomp/chariot-hardened.json) and
# must be placed on every node's kubelet seccomp root
# (--root-dir/seccomp/profiles, default /var/lib/kubelet/seccomp/profiles)
# at the SAME relative path before enabling this — the kubelet fails the pod
# closed (not silently falls back to RuntimeDefault) if the file is missing.
seccomp:
  customProfile:
    enabled: false
    # Path is relative to the kubelet seccomp root
    # (<kubelet-root-dir>/seccomp/<localhostProfile>), per the K8s
    # localhostProfile contract. Ships in this chart at
    # files/seccomp/chariot-hardened.json — copy it to every node's
    # <kubelet-root-dir>/seccomp/profiles/chariot-hardened.json first.
    localhostProfile: "profiles/chariot-hardened.json"
podSecurityContext:
  runAsNonRoot: true
  # runAsUser / runAsGroup / fsGroup are DELIBERATELY UNSET at the pod level for
  # the same reason as the container block below: OpenShift's default
  # `restricted-v2` SCC allocates all three from the namespace's own ranges
  # (`openshift.io/sa.scc.uid-range`, `.../supplemental-groups`), and a pinned
  # 1000 falls outside every realistic range, so admission would reject the pod
  # unless the buyer grants `nonroot-v2` or `anyuid`.
  #
  # fsGroup mattered most here: it is what chowns the mounted data volume, so
  # pinning it to 1000 while OpenShift injects a different UID produced a volume
  # the process could not write. Leaving it unset lets the SCC pick a value that
  # is consistent with the injected UID. On vanilla Kubernetes the image's own
  # `USER 1000:1000` still applies and /app plus the runtime dir are group-0
  # writable with setgid, so nothing regresses there.
  #
  #   runAsUser: 1000
  #   runAsGroup: 1000
  #   fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  # runAsUser is DELIBERATELY UNSET so this chart is admissible under OpenShift's
  # default `restricted-v2` SCC. That SCC uses the MustRunAsRange strategy and
  # allocates UIDs per namespace from the project's
  # `openshift.io/sa.scc.uid-range` annotation (ranges look like
  # 1000680000-1000689999). Red Hat's guidance is explicit: "for Openshift's
  # restricted/restricted-v2 SCC you MUST leave the runAsUser field empty, or
  # provide a value that falls within the specific user range for the namespace.
  # Otherwise, you will only be able to run the Pod if it has access to the SCC
  # nonroot-v2 or anyuid." A hardcoded 1000 is outside every realistic range, so
  # pinning it forced buyers into a cluster-admin SCC grant and would be flagged
  # in Red Hat container certification.
  #
  # Nothing is weakened by omitting it. The image declares `USER 1000:1000`
  # (Dockerfile), which is what satisfies runAsNonRoot on vanilla Kubernetes,
  # and /app plus the runtime dir are group-0 owned and group-writable with the
  # setgid bit, so an injected UID can write. Operators who need a pinned UID on
  # non-OpenShift clusters can set `gateway.securityContext.runAsUser` back.
  #
  #   runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ── Pod egress NetworkPolicy (Wiz "isolate and sandbox" gap #8) ───────────────
# Default OFF so existing installs render/behave identically on upgrade
# (opt-in, no regression). When enabled, the policy is deny-by-default
# egress: only DNS, the gateway's own in-cluster MongoDB/Redis pods (when
# those subcharts are enabled), and the buyer-declared CIDR/port allowlist
# below are permitted — everything else is blocked by the K8s NetworkPolicy
# object model (an egress NetworkPolicy with no matching rule denies).
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, AWS VPC CNI
# with NP support, …) — on a non-enforcing CNI this renders but has no
# effect, which fails OPEN, not closed; verify enforcement in your cluster.
networkPolicy:
  enabled: false
  # Cluster DNS egress. Always allowed when networkPolicy.enabled and
  # dns.enabled — the gateway cannot resolve names (including the buyer's
  # own MCP/AWS endpoints below) without it. Defaults match EKS CoreDNS.
  dns:
    enabled: true
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
    port: 53
  # Buyer-declared external endpoints the gateway is allowed to reach (MCP
  # servers, AWS License Manager/STS/etc. via IRSA — see serviceAccount.roleArn).
  # K8s NetworkPolicy has no native FQDN matching, so hostnames must be
  # resolved to CIDRs by the operator (a /32 for a single fixed IP, or the
  # provider's published range, e.g. AWS ip-ranges.json for the target
  # region/service).
  allowedEgress: []
  # - cidr: "203.0.113.10/32"   # example: buyer's declared MCP endpoint
  #   ports: [443]
  # - cidr: "52.94.0.0/16"      # example: AWS service range for the buyer's region
  #   ports: [443]
  # Raw NetworkPolicyEgressRule entries, rendered as-is, for anything the
  # structured `allowedEgress` shorthand above can't express (e.g. a
  # namespaceSelector-based rule to reach another in-cluster service).
  extraEgressRules: []

# ── Vendored MongoDB subchart (image 2 of 3) — CH-28 ─────────────────────────
mongodb:
  enabled: true
  image:
    # AWS Marketplace rewrites this field per region. Empty → global.imageRegistry.
    registry: ""
    # Docker Official mongo image (env: MONGO_INITDB_ROOT_USERNAME/PASSWORD).
    repository: mongo
    tag: "8.0.34"   # pinned; never "latest" (CH-26)
    digest: "sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907"
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    database: "epicai"
    username: "chariot"
    # CH-28 fail-closed: supply creds via an operator K8s Secret (PREFERRED)…
    existingSecret: ""          # keys: mongodb-root-password, mongodb-password
    # …or an inline password. The chart REFUSES a blank or weak/default value
    # (mirrors src/iam/bootstrap.ts WEAK_SECRETS). No default is ever generated.
    rootPassword: ""
    password: ""
  persistence:
    enabled: true
    storageClass: ""
    size: 20Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"
  nodeSelector:
    kubernetes.io/arch: amd64

# ── Vendored Redis subchart (image 3 of 3) — CH-28 ───────────────────────────
redis:
  enabled: true
  image:
    # AWS Marketplace rewrites this field per region. Empty → global.imageRegistry.
    registry: ""
    repository: redis
    tag: "8.10.2"   # pinned glibc base; never "latest" (CH-26)
    digest: "sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6"
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    # CH-28 fail-closed: operator Secret (PREFERRED) …
    existingSecret: ""          # key: redis-password
    # … or inline password; blank/weak/default is REFUSED.
    password: ""
  persistence:
    enabled: true
    storageClass: ""
    size: 8Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  nodeSelector:
    kubernetes.io/arch: amd64
