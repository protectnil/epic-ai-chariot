# Epic AI® Chariot — Helm values (CHARIOT-SPEC §23.2, CH-24…CH-30).
#
# CH-29 invariant: EVERY image reference lives in THIS file. Templates never
# hard-code an image. An air-gapped install only needs to override
# `global.imageRegistry` to repoint all three images at the Marketplace ECR —
# see values-airgap.yaml.
#
# AWS Marketplace "Helm chart structure requirements" (container-product-policies)
# requires each image to carry `registry` / `repository` / `tag` as sibling
# fields so the Marketplace regionalization step can rewrite the registry host
# per region. Each of the three image blocks below therefore declares its own
# `registry`. It defaults to "" and falls back to `global.imageRegistry`, so the
# CH-29 single-knob air-gap override keeps working exactly as before.

global:
  # Fallback registry prefix, applied to any image whose own `registry` is empty.
  # Empty AND no per-image `registry` = the render ABORTS (CH-29: the chart
  # never falls back to Docker Hub). For air-gap set this to your
  # Marketplace ECR, e.g. "<acct>.dkr.ecr.<region>.amazonaws.com"
  # (values-airgap.yaml). Per-image `registry` takes precedence.
  imageRegistry: ""
  # Pull secrets for a private registry / Marketplace ECR.
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# ── Gateway (image 1 of 3) ───────────────────────────────────────────────────
gateway:
  replicaCount: 1

  image:
    # AWS Marketplace rewrites this field per region. Empty → global.imageRegistry.
    registry: ""
    # CHARIOT-SPEC §23.2 image 1: `chariot-gateway`. Must equal the repository
    # .github/workflows/marketplace-ecr.yml pushes (GATEWAY_IMAGE_REPOSITORY_NAME).
    repository: chariot-gateway
    # CH-26: immutable tag, format chariot-vX.Y.Z. NEVER "latest".
    # Emitted by `node scripts/release.mjs --emit-image-tag`.
    tag: "chariot-v4.0.0"
    # CH-26: optional digest pin. When set it takes precedence over `tag`
    # (strongest immutability). Example: "sha256:abc123…".
    digest: ""
    pullPolicy: IfNotPresent

  # CH-28 fail-closed: REQUIRED operator-supplied Secret holding the gateway's
  # sensitive env. The chart aborts templating if this is empty — no default,
  # no blank (mirrors src/iam/bootstrap.ts requireEnv). The Secret MUST provide:
  #   ENTERPRISE_JWT_SECRET   (>=16 chars, high-entropy)
  #   ENTERPRISE_MASTER_KEY   (AES-256 base64)
  #   MONGODB_URI             (must embed the mongodb auth below)
  #   REDIS_URL               (must embed the redis auth below)
  existingSecret: ""

  # Enterprise multi-user mode (src/iam/bootstrap.ts). Off => single-user.
  enterprise: true

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  # Probes hit GET /health (src/engine/gateway/InferenceGateway.ts:167).
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 40
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Extra non-secret env for integration (e.g. Phase 3/4 EdgeShard/SPLADE/BIEN-dense
  # paths) without editing templates. Sensitive values must come from
  # existingSecret. NOTE: none of CHARIOT_SPLADE_MODEL_DIR / CHARIOT_DENSE_MODEL_DIR /
  # ORT_DYLIB_PATH need an entry here in the default deployment — the Dockerfile
  # bakes each as an image-level ENV default pointing at its own COPY destination
  # (BIEN::§9::10); this list only overrides that default for a non-stock layout.
  extraEnv: []
  #  - name: CHARIOT_EXAMPLE
  #    value: "x"

  nodeSelector:
    # CH-30: single-arch linux/amd64 (napi target x86_64-unknown-linux-gnu).
    kubernetes.io/arch: amd64
  tolerations: []
  affinity: {}
  podAnnotations: {}

# ── License entitlement (CH-24) ──────────────────────────────────────────────
license:
  # "offline"  => Ed25519 offline license (§11). DEFAULT for every non-Marketplace
  #               deployment (CH-24: "offline Ed25519 stays default off-Marketplace").
  # "aws-license-manager" => AWS License Manager CheckoutLicense at boot.
  provider: "offline"
  awsLicenseManager:
    enabled: false
    # REQUIRED when enabled: the Marketplace product SKU / License Manager
    # license ARN, and the purchased tier (basic | intermediate | premium).
    # The LM boot gate fails closed if these are unset.
    productSKU: ""
    tier: ""
    # PROVISIONAL | PERPETUAL — License Manager checkout type.
    checkoutType: "PROVISIONAL"
    seats: ""
    tierEntitlement: ""
    seatsEntitlement: ""
    keyFingerprint: ""
    beneficiary: ""
    nodeId: ""
  # AWS region for License Manager (only consulted when provider is
  # aws-license-manager). The container holds NO static AWS keys (CH-25); access
  # is via the IRSA role on serviceAccount.roleArn below.
  region: ""

# ── ServiceAccount / IRSA (CH-25) ────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  # EKS IRSA: IAM role ARN granting the pod AWS access (e.g. License Manager
  # CheckoutLicense). The container requests NO AWS credentials and bakes NO
  # keys (CH-25) — all AWS access flows through this role. Leave empty when
  # license.provider is "offline".
  roleArn: ""
  annotations: {}
  # Deny-by-default: the gateway needs NO Kubernetes API access, so the
  # projected API token is not mounted (CIS 5.1.5/5.1.6). IRSA is unaffected —
  # the EKS pod-identity webhook injects its own aws-iam-token projected volume
  # independent of this setting. Set true only if a cluster add-on genuinely
  # needs the in-pod API token.
  automountServiceAccountToken: false

# ── Service ──────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 8000
  annotations: {}

# ── CH-54 image seal / deploy-time signature verification ────────────────────
# Default-on and fail-closed:
# - EKS: Kyverno admission policy verifies the gateway image signature.
# - ECS: a Lambda lifecycle hook verifies the same Notation signature before
#   the service scales up.
# - OpenShift / IBM Marketplace: RHACS (Red Hat Advanced Cluster Security) is
#   the certified admission-time verifier on that channel, not Kyverno.
# - Offline verification: the trust policy and trust-store material are shipped
#   in the rendered chart / deployment bundle.
imageVerification:
  enabled: true
  # Which admission-time verifier renders/applies:
  #   kyverno — ClusterPolicy (templates/image-verify-policy.yaml). Default;
  #             this is what EKS installs get and nothing changes for them.
  #   rhacs   — RHACS (StackRox) is the OpenShift-certified verifier. RHACS
  #             has NO Helm-renderable CRD for SignatureIntegration or its
  #             enforcement policy (both are Central-owned REST resources,
  #             per Red Hat Advanced Cluster Security for Kubernetes docs,
  #             "Operating > Verifying image signatures") — this chart ships
  #             a ConfigMap (templates/rhacs-signature-integration-note.yaml)
  #             carrying the exact payload + roxctl commands an operator (or
  #             a CI step with Central access) runs to reproduce Kyverno's
  #             enforcement in RHACS. No Kyverno ClusterPolicy is rendered.
  #   none    — no admission-time verifier renders at all. Refused by
  #             chariot.assertImageVerifyFailClosed unless
  #             allowInsecureAdmissionMode=true (see below) — CH-54 requires
  #             SOME deploy-time verifier; "none" must be a deliberate choice.
  engine: kyverno
  # Break-glass: leave false so the chart fails closed (refuses to render) when
  # NO verifier will actually run at admission time — imageVerification.enabled:
  # false, engine: none, or (kyverno only) a weakened validationFailureAction /
  # failurePolicy. Set true only to deliberately install without one (CH-54).
  allowInsecureAdmissionMode: false
  kyverno:
    validationFailureAction: Enforce
    failurePolicy: Fail
    timeoutSeconds: 30
  # RHACS (engine: rhacs) values. Consumed by
  # templates/rhacs-signature-integration-note.yaml, which turns these into
  # the roxctl invocation + Central API payload an operator applies manually
  # — RHACS itself is not Helm-managed (see the `engine` comment above).
  rhacs:
    # Required (fail-closed, see chariot.assertImageVerifyFailClosed) whenever
    # engine=rhacs and allowInsecureAdmissionMode is false: proves the value
    # was supplied deliberately, not that Central enforces it yet — that is
    # verified out-of-band after the operator completes the ConfigMap's steps.
    signatureIntegrationName: ""
    enforcementPolicyName: ""
    cosign:
      # PEM-encoded Cosign public keys, static-key verification.
      publicKeys: []
      # Keyless (Sigstore Fulcio/Rekor) verification instead of publicKeys.
      certificateOIDCIssuer: ""
      certificateIdentity: ""
  notation:
    trustPolicy:
      name: aws-signer-tp
      registryScopes:
        - "*"
      trustStores:
        - signingAuthority:aws-signer-ts
        - signingAuthority:aws-us-gov-signer-ts
      # The AWS Signer signing profile that signs the Chariot images (seller
      # account 827566276480, profile chariot_gateway_notation). Operators who
      # re-sign images with their own profile replace this ARN.
      trustedIdentities:
        - arn:aws:signer:us-east-1:827566276480:/signing-profiles/chariot_gateway_notation
    # PEM bundle shipped with the deployment so offline verification can use
    # only public material: the AWS Signer Code Signing Root CA G1 (commercial)
    # and the AWS Signer Code Signing GovCloud (US) Root CA G1, as published at
    # https://docs.aws.amazon.com/signer/latest/developerguide/image-signing-prerequisites.html
    # (d2hvyiie56hcat.cloudfront.net/aws-signer-notation-root.cert and
    # aws-us-gov-signer-notation-root.cert). Signatures are partition-isolated.
    certs: |-
      -----BEGIN CERTIFICATE-----
      MIICWTCCAd6gAwIBAgIRAMq5Lmt4rqnUdi8qM4eIGbYwCgYIKoZIzj0EAwMwbDEL
