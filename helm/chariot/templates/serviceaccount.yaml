{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chariot.serviceAccountName" . }}
  labels:
    {{- include "chariot.labels" . | nindent 4 }}
  annotations:
    {{- /* CH-25: AWS access via IRSA only — no static keys baked into the
           container. When license.provider is offline, roleArn stays empty
           and no AWS role is attached. */ -}}
    {{- with .Values.serviceAccount.roleArn }}
    eks.amazonaws.com/role-arn: {{ . | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# CH-25: no AWS credentials are mounted or projected; tokens for IRSA are
# injected by the EKS pod-identity webhook, not by this chart. The gateway needs
# no Kubernetes API access, so the projected SA token is NOT mounted by default
# (deny-by-default; overridable via serviceAccount.automountServiceAccountToken).
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
