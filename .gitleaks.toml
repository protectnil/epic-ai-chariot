title = "Epic AI® Chariot Gitleaks Config"

[allowlist]
description = "Test-only fixtures with localhost-scoped material."
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)\.git/''',
  '''(^|/)native/target/''',
  '''(^|/)native/.*\.node$''',
  '''(?i)\.gitleaks\.toml$''',
  # Test fixture: embedded localhost TLS key + cert for the OIDC issuer mock.
  # The HTTPS server is bound to 127.0.0.1 only and never reaches production.
  '''(^|/)test/idp-mfa-routes\.mjs$''',
  # Test fixture: base64 placeholder secrets for enterprise-hardening tests.
  '''(^|/)test/enterprise-hardening(-v2)?\.mjs$''',
]
