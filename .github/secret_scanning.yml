# Exclude DLP evaluation fixtures and AI-eval artifact dumps from
# GitHub secret scanning.
#
# The files at the paths listed below are algorithmically-generated
# DLP detector corpora and eval-run artifact dumps. They contain
# strings that match the OFFICIAL prefix shapes of common secret
# classes (AWS AKIA*, GitHub ghp_*, Stripe sk_test_*, Slack xoxb_*,
# Twilio AC*, Azure AccountKey=, npm npm_*, PEM BEGIN PRIVATE KEY,
# JWT three-segment base64url, Luhn-valid card numbers, post-2011
# randomized SSNs, etc.) because their purpose is to exercise the
# DLP regex set that detects those classes.
#
# None of these strings is a real credential. The generator at
# test/ai-evals/_fixtures/generate-dlp-corpus.mjs documents the
# synthesis methodology and any reviewer can run it to regenerate
# the corpus byte-for-byte.
#
# Secret scanning on these paths produces a constant stream of
# false positives that block legitimate pushes. Excluding them
# focuses scanner attention on paths that could plausibly contain
# real secrets (source, scripts, workflows, docs).
paths-ignore:
  # Fixture, artifact, and baseline subtrees under the AI eval suite —
  # these contain corpus files and recorded eval-run outputs that have
  # the highest concentration of synthetic-secret strings.
  - 'test/ai-evals/_fixtures/**'
  - 'test/ai-evals/_artifacts/**'
  - 'test/ai-evals/_baselines/**'
  # The DLP eval scripts themselves carry inline positive-case test
  # values (Stripe sk_test_*, AWS AKIA*, etc.) so the eval can verify
  # the detector flags each class. These are inline JS strings in the
  # .mjs source, not external fixtures.
  - 'test/ai-evals/*.mjs'
  - 'test/ai-evals/**/*.mjs'
  # MCP adapter base contract test exercises adapters that consume
  # API-key-shaped strings (a Stripe-format key as a sample auth value
  # to verify the adapter rejects malformed inputs). The values are
  # inline literals in the test, not real credentials.
  - 'test/mcp-adapter-base-contract.mjs'
